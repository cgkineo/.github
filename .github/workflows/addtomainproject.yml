name: Add to Project Workflow
on:
  workflow_call:
    inputs:
      project-url:
        description: 'GitHub project URL'
        required: false
        type: string
        default: 'https://github.com/orgs/cgkineo/projects/3/views/1'
jobs:
  add-to-project:
    name: Add to main project
    runs-on: ubuntu-latest
    # Dependabot runs can't read Actions secrets
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # Org variables and secrets don't reach private repos on our plan.
          # The client ID is public, so it lives here. Each private repo needs
          # its own ADDTOPROJECT_APP_KEY repository secret.
          client-id: Iv23liYjrssmnH2oUCuJ
          private-key: ${{ secrets.ADDTOPROJECT_APP_KEY }}
          owner: cgkineo
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: ${{ inputs.project-url }}
          github-token: ${{ steps.app-token.outputs.token }}
